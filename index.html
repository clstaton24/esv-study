<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angus Church Study</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #1f2230;
  color: #fff;
  text-align: center;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 6px;
  border: none;
}
button {
  padding: 12px;
  margin: 10px 0;
  width: 100%;
  border: none;
  border-radius: 6px;
  background: #5d7fbe;
  color: white;
  font-weight: bold;
}
.card {
  background: #2a2e40;
  padding: 15px;
  border-radius: 8px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

  <h1>ANGUS CHURCH STUDY</h1>

  <h2 id="sermon-title"></h2>
  <p id="sermon-speaker"></p>

  <input id="verse-ref" placeholder="Scripture reference" />

  <div id="sermon-points"></div>

  <div id="reflection"></div>

</div>

<script>

/* ===============================
   GLOBALS
=============================== */
let weeklySermon = null;

const sermonFeedUrl =
"https://script.google.com/macros/s/AKfycbxBKe6aH0vIWYk38QSEVXCuqMLchI4JI8oEGoQ_RP_mK8koa0f9_qQKI4KBfuVhZMxD/exec";

/* ===============================
   LOAD FROM GOOGLE SHEETS
=============================== */
async function loadWeeklySermonFromSheet() {
  try {
    const res = await fetch(sermonFeedUrl);
    const data = await res.json();

    console.log("Loaded sermon:", data);

    weeklySermon = data;

    applyWeeklySermonToUI();

  } catch (err) {
    console.error("Error loading sermon:", err);
  }
}

/* ===============================
   APPLY TO UI
=============================== */
function applyWeeklySermonToUI() {
  if (!weeklySermon) return;

  document.getElementById('sermon-title').textContent =
    weeklySermon.title || '';

  document.getElementById('sermon-speaker').textContent =
    weeklySermon.speaker ? "Speaker: " + weeklySermon.speaker : '';

  if (weeklySermon.passage) {
    document.getElementById('verse-ref').value =
      weeklySermon.passage;
  }

  renderSermonPoints();
  renderReflectionQuestions();
}

/* ===============================
   SERMON POINTS
=============================== */
function renderSermonPoints() {
  const box = document.getElementById('sermon-points');
  box.innerHTML = "<h2>Points of Emphasis</h2>";

  (weeklySermon.pointsOfEmphasis || []).forEach((p, i) => {
    box.innerHTML += `<div class="card">${i+1}. ${p}</div>`;
  });
}

/* ===============================
   REFLECTION QUESTIONS
=============================== */
function renderReflectionQuestions() {
  const box = document.getElementById('reflection');
  box.innerHTML = "<h2>Reflection</h2>";

  const questions =
    weeklySermon.reflectionQuestions?.adult || [];

  questions.forEach((q) => {
    box.innerHTML += `
      <div class="card">
        <p><strong>${q}</strong></p>
        <textarea placeholder="Your response..."></textarea>
      </div>
    `;
  });
}

/* ===============================
   AUTO LOAD ON START (FIXED)
=============================== */
window.onload = function () {
  loadWeeklySermonFromSheet();
};

</script>

</body>
</html>
